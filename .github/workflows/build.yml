name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show compiler version
        run: g++ --version
      - name: Build every exercise with -Wall -Wextra -Werror
        run: python3 tools/build_all.py --strict
